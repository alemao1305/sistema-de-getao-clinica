# ==============================================================================
# OPÇÃO 1 (RECOMENDADA / INFALÍVEL): CLÍNICA FABRIS COM BANCO INTEGRADO (SQLite)
# ==============================================================================
# Por que esta opção é a melhor no TrueNAS:
# 1. Não precisa de container do MariaDB (menos consumo de memória RAM).
# 2. Não sofre com erro de "Access Denied" de IPv6 nem de permissão de pasta do ZFS.
# 3. Sobe em 3 segundos pronto para uso.
# ==============================================================================

version: "3.8"

services:
  app:
    image: melloinfra/clinica:latest
    container_name: clinica_app
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      APP_NAME: "Clínica Fabris"
      APP_ENV: production
      APP_DEBUG: "true"
      APP_KEY: "base64:9dHDOIV7xhkPSeEcjxOKIPU9SPrHwYekOELv+TMSRY8="
      APP_URL: "http://192.168.1.134:8090"
      APP_TIMEZONE: "America/Sao_Paulo"
      APP_LOCALE: "pt_BR"

      # Banco SQLite Integrado Persistente
      DB_CONNECTION: sqlite

      # Sessões e Cache estáveis
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database

      RUN_MIGRATIONS: "true"
    volumes:
      # Volumes gerenciados automaticamente pelo TrueNAS (sem conflito de permissão)
      - clinica_storage:/var/www/storage
      - clinica_database:/var/www/database

volumes:
  clinica_storage:
    name: clinica_storage
  clinica_database:
    name: clinica_database

x-portals:
  - host: 0.0.0.0
    name: Web UI
    path: /
    port: 8090
    scheme: http
