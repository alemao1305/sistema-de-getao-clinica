# ==============================================================================
# OPÇÃO 2: CLÍNICA FABRIS COM MARIADB 10.11
# ==============================================================================
# Atenção: Antes de usar esta opção, execute no Shell do TrueNAS:
# mkdir -p /mnt/server/apps/clinica/storage /mnt/server/apps/clinica/mariadb
# chmod -R 777 /mnt/server/apps/clinica
# ==============================================================================

version: "3.8"

services:
  app:
    image: melloinfra/clinica:latest
    container_name: clinica_app
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      APP_NAME: "Clínica Fabris"
      APP_ENV: production
      APP_DEBUG: "true"
      APP_KEY: "base64:9dHDOIV7xhkPSeEcjxOKIPU9SPrHwYekOELv+TMSRY8="
      APP_URL: "http://192.168.1.134:8090"
      APP_TIMEZONE: "America/Sao_Paulo"
      APP_LOCALE: "pt_BR"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: clinica_db
      DB_USERNAME: clinica_user
      DB_PASSWORD: "clinica_secure_password_2026"

      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database

      RUN_MIGRATIONS: "true"
    volumes:
      - /mnt/server/apps/clinica/storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinica_net

  db:
    image: mariadb:10.11
    container_name: clinica_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "root_clinica_password_2026"
      MYSQL_DATABASE: clinica_db
      MYSQL_USER: clinica_user
      MYSQL_PASSWORD: "clinica_secure_password_2026"
    volumes:
      - /mnt/server/apps/clinica/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinica_net

networks:
  clinica_net:
    name: clinica_net
    driver: bridge
    enable_ipv6: false

x-portals:
  - host: 0.0.0.0
    name: Web UI
    path: /
    port: 8090
    scheme: http
