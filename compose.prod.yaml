services:
  app:
    image: melloinfra/clinica:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinica_producao
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      APP_NAME: "Clínica Fabris"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:9dHDOIV7xhkPSeEcjxOKIPU9SPrHwYekOELv+TMSRY8="
      APP_URL: http://localhost:8085
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: clinica_db
      DB_USERNAME: clinica_user
      DB_PASSWORD: clinica_secure_password_2026
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinica_prod_net

  db:
    image: mariadb:10.11
    container_name: clinica_db_producao
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_db
      MYSQL_USER: clinica_user
      MYSQL_PASSWORD: clinica_secure_password_2026
      MYSQL_ROOT_PASSWORD: root_clinica_password_2026
    volumes:
      - clinica_prod_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinica_prod_net

volumes:
  clinica_prod_dbdata:
    driver: local

networks:
  clinica_prod_net:
    driver: bridge
