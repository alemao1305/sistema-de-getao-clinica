services:
  app:
    image: php:8.4-cli-alpine
    container_name: clinica_fabris_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-8085}:8085"
    command: php artisan serve --host=0.0.0.0 --port=8085
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - PHP_CLI_SERVER_WORKERS=4
